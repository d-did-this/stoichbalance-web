<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stoichbalance - Fun Chemistry UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

<script>
// Unified Audio Engine and Page Transitions
const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
let audioCtx;

window.initAudio = function() {
    if (!audioCtx) audioCtx = new AudioCtxClass();
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

// Ensure audio context is started on first interaction anywhere
document.addEventListener('click', () => {
    if(!audioCtx) window.initAudio();
    else if(audioCtx.state === 'suspended') audioCtx.resume();
}, {once: false});

window.playSound = async function(type) {
    if (!audioCtx) window.initAudio();
    if (audioCtx.state === 'suspended') {
        try { await audioCtx.resume(); } catch(e) {}
    }


    
    try {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'start') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'select') {
            // "choosing btween activity cshould have a btter unique sound instead" -> Marimba/Woodblock pop
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'swoosh') {
            // "expandinga nd collasping ethe element tray and teh prf beaker, it shoudl have a swoosh sound instead"
            // Simulate swoosh with a fast filtered noise burst or a rapid low sine sweep
            osc.type = 'sine';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'drop') {
            // "change teh audio of adding stuff n to teh drop box" - plop sound
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'remove') {
            // "removing them" - reverse plop
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'trash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'success') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
            osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3); // C6
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.8);
        } else if (type === 'sad') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'hint') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'back' || type === 'page') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.15);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else {
            // Default
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
    } catch(e) {
        console.warn("Audio generation failed", e);
    }
};

// PAGE TRANSITION LOGIC
window.transitionTo = function(url) {
    let overlay = document.getElementById('iris-wipe-overlay');
    if(overlay) {
        overlay.classList.remove('open');
        setTimeout(() => { window.location.href = url; }, 550);
    } else {
        window.location.href = url;
    }
};

window.addEventListener('load', () => {
    let overlay = document.getElementById('iris-wipe-overlay');
    if(overlay) {
        overlay.classList.add('open');
    }
});

</script>
</head>
<body>
    <div id="iris-wipe-overlay"></div>


    <!-- HIGH-INTENSITY DYNAMIC BACKGROUNDS -->
    <div class="bg-layer bg-blue active-bg" id="bg-class"></div>
    <div class="bg-layer bg-purple" id="bg-challenge"></div>
    <div class="bg-layer bg-orange" id="bg-sandbox"></div>

    <!-- INTERACTIVE CHEMISTRY CANVAS -->
    <div id="particle-canvas"></div>

    <!-- Fun Chunky Widgets -->
    <button class="fun-widget widget-left interactive" onclick="alert('Help Guide Opened!')">
        <div class="widget-icon">❓</div>
    </button>

    <button class="fun-widget widget-right interactive" onclick="openElements()">
        <div class="widget-icon">🧪</div>
    </button>

    <!-- HIGHLY DESIGNED MAIN CONTAINER -->
    <div class="main-container">
        <!-- Glossy highlight overlay -->
        <div class="container-glare"></div>
        
        <!-- LEFT PANEL: BRANDING & START -->
        <div class="panel left-panel">
            <div class="brand-wrapper">
                <div class="logo-icon bounce-anim">⚖️</div>
                <h1 class="logo-title">Stoichbalance</h1>
                <p class="logo-subtitle">Chemistry Made Fun!</p>
            </div>
            
            <div class="launch-wrapper">
                <div class="input-group">
                    <label>PLAYER NAME</label>
                    <input type="text" class="name-input interactive" id="player-name" placeholder="Type your name..." value="">
                </div>
                
                <button class="btn-play interactive" id="main-play-btn" onclick="startGame()">
                    <span id="play-btn-text">Start Form 4</span>
                    <span class="play-icon">▶</span>
                </button>
            </div>
        </div>

        <!-- RIGHT PANEL: MODE SELECTION -->
        <div class="panel right-panel">
            <h2 class="panel-title">Choose Activity</h2>
            
            <div class="modes-list">
                
                <!-- Class Mode -->
                <div class="mode-card card-blue interactive active-mode" id="mode-class" onclick="selectMode('class')">
                    <div class="mode-header">
                        <div class="mode-icon">📚</div>
                        <div class="mode-info">
                            <h3 class="mode-name">Class Mode</h3>
                            <p class="mode-desc">Standard curriculum progression.</p>
                        </div>
                    </div>
                    <div class="mode-options-wrapper">
                        <div class="mode-options-inner">
                            <div class="mode-options-content">
                                <button class="sub-btn interactive active-sub" onclick="selectSubOption(event, 'class', 'Form 4')">Form 4</button>
                                <button class="sub-btn interactive" onclick="selectSubOption(event, 'class', 'Form 5')">Form 5</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Challenge Mode -->
                <div class="mode-card card-purple interactive" id="mode-challenge" onclick="selectMode('challenge')">
                    <div class="mode-header">
                        <div class="mode-icon">⏱️</div>
                        <div class="mode-info">
                            <h3 class="mode-name">Challenge Mode</h3>
                            <p class="mode-desc">Test your balancing speed and accuracy.</p>
                        </div>
                    </div>
                    <div class="mode-options-wrapper">
                        <div class="mode-options-inner">
                            <div class="mode-options-content">
                                <button class="sub-btn interactive active-sub" onclick="selectSubOption(event, 'challenge', 'Easy')">Easy</button>
                                <button class="sub-btn interactive" onclick="selectSubOption(event, 'challenge', 'Medium')">Medium</button>
                                <button class="sub-btn interactive" onclick="selectSubOption(event, 'challenge', 'Hard')">Hard</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sandbox Mode -->
                <div class="mode-card card-orange interactive" id="mode-sandbox" onclick="selectMode('sandbox')">
                    <div class="mode-header">
                        <div class="mode-icon">🛠️</div>
                        <div class="mode-info">
                            <h3 class="mode-name">Sandbox Mode</h3>
                            <p class="mode-desc">Create custom questions for learning.</p>
                        </div>
                    </div>
                    <div class="mode-options-wrapper">
                        <div class="mode-options-inner">
                            <div class="mode-options-content" style="padding-top: 0; gap: 0;"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script src="js/app.js?v=1791074758316"></script>
</body>
</html>

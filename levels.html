<script>
// Unified Audio Engine and Page Transitions
const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

window.initAudio = function() {
    if (!audioCtx) {
        audioCtx = new AudioCtxClass();
        window.audioCtx = audioCtx;
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
};

// Ensure audio context is unlocked on first interaction anywhere
const audioUnlockEvents = ['click', 'pointerdown', 'touchstart', 'mousedown', 'keydown'];
audioUnlockEvents.forEach(evt => {
    document.addEventListener(evt, () => {
        window.initAudio();
    }, {passive: true, once: false});
});

window.playSound = function(type) {
    if (!audioCtx) window.initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    
    try {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'start') {
            if (window.__AUDIO_ASSETS && window.__AUDIO_ASSETS.start) {
                try {
                    const audio = new Audio(window.__AUDIO_ASSETS.start);
                    audio.volume = 0.85;
                    audio.play().catch(e => console.warn("HTML5 audio playback notice:", e));
                } catch(e){}
            }
            // Rich, resonant laboratory power-on chord (C4, G4, C5, E5)
            const t0 = audioCtx.currentTime;
            const chord = [261.63, 392.00, 523.25, 659.25];
            chord.forEach((freq, idx) => {
                const noteOsc = audioCtx.createOscillator();
                const noteGain = audioCtx.createGain();
                noteOsc.type = idx < 2 ? 'triangle' : 'sine';
                noteOsc.frequency.setValueAtTime(freq, t0 + idx * 0.035);
                noteGain.gain.setValueAtTime(0.001, t0 + idx * 0.035);
                noteGain.gain.linearRampToValueAtTime(0.32, t0 + idx * 0.035 + 0.02);
                noteGain.gain.exponentialRampToValueAtTime(0.001, t0 + idx * 0.035 + 0.38);
                noteOsc.connect(noteGain);
                noteGain.connect(audioCtx.destination);
                noteOsc.start(t0 + idx * 0.035);
                noteOsc.stop(t0 + idx * 0.035 + 0.38);
            });
            return;
        } else if (type === 'retro-select' || type === 'level-launch') {
            if (window.__AUDIO_ASSETS && window.__AUDIO_ASSETS.retroSelect) {
                try {
                    const audio = new Audio(window.__AUDIO_ASSETS.retroSelect);
                    audio.volume = 0.85;
                    audio.play().catch(e => console.warn("HTML5 audio playback notice:", e));
                } catch(e){}
            }
            // Completely unique arcade level-launch ascending sparkle chime (F5 -> A5 -> C6 -> E6 glide)
            const t0 = audioCtx.currentTime;
            const arpeggio = [698.46, 880.00, 1046.50, 1318.51];
            arpeggio.forEach((freq, idx) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = idx === 3 ? 'sine' : 'triangle';
                o.frequency.setValueAtTime(freq, t0 + idx * 0.045);
                if (idx === 3) {
                    o.frequency.exponentialRampToValueAtTime(1760.0, t0 + idx * 0.045 + 0.22);
                }
                g.gain.setValueAtTime(0.001, t0 + idx * 0.045);
                g.gain.linearRampToValueAtTime(0.36, t0 + idx * 0.045 + 0.015);
                g.gain.exponentialRampToValueAtTime(0.001, t0 + idx * 0.045 + 0.28);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start(t0 + idx * 0.045);
                o.stop(t0 + idx * 0.045 + 0.28);
            });
            return;
        } else if (type === 'select') {
            // "choosing btween activity cshould have a btter unique sound instead" -> Marimba/Woodblock pop
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'swoosh') {
            // "expandinga nd collasping ethe element tray and teh prf beaker, it shoudl have a swoosh sound instead"
            // Simulate swoosh with a fast filtered noise burst or a rapid low sine sweep
            osc.type = 'sine';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'drop') {
            // "change teh audio of adding stuff n to teh drop box" - plop sound
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'remove') {
            // "removing them" - reverse plop
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'trash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'success') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
            osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3); // C6
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.8);
        } else if (type === 'sad') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'hint') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'back' || type === 'page') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.15);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else {
            // Default
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
    } catch(e) {
        console.warn("Audio generation failed", e);
    }
};

// PAGE TRANSITION LOGIC
window.transitionTo = function(url) {
    let overlay = document.getElementById('iris-wipe-overlay');
    if(overlay) {
        overlay.classList.remove('open');
    }
    setTimeout(() => { window.location.href = url; }, 480);
};

window.addEventListener('load', () => {
    let overlay = document.getElementById('iris-wipe-overlay');
    if(overlay) {
        overlay.classList.add('open');
    }
});

</script>

<script>
let myCurrentPage = 1;
const ITEMS_PER_PAGE = 6;
let myTotalPages = 1;

function getLevelIcon(title, isSolved) {
    if (isSolved) return '✅';
    let t = (title || '').toLowerCase();
    
    // Haber Process / Ammonia
    if (t.includes('haber') || t.includes('ammonia')) return '🏭';
    // Sodium-Water Reaction
    if (t.includes('sodium') || t.includes('water reaction')) return '💥';
    // Halogen Displacement
    if (t.includes('halogen') || t.includes('iodide') || t.includes('bromide')) return '🧪';
    // Acid-Metal Reaction
    if (t.includes('acid-metal') || (t.includes('acid') && t.includes('metal') && !t.includes('carbonate'))) return '⚗️';
    // Neutralisation
    if (t.includes('neutral')) return '💧';
    // Metal Displacement
    if (t.includes('metal displacement')) return '🪙';
    // Acid-Carbonate Reaction
    if (t.includes('carbonate')) return '🫧';
    // Combustion
    if (t.includes('combust') || t.includes('burn')) return '🔥';
    // Precipitation
    if (t.includes('precipit')) return '🌧️';
    // Decomposition
    if (t.includes('decomp')) return '⚡';
    // Oxidation of Magnesium
    if (t.includes('magnesium') || t.includes('oxidation')) return '✨';
    // Esterification
    if (t.includes('ester')) return '🍓';
    // Hydration of Ethene
    if (t.includes('ethene') || t.includes('hydrat')) return '🌊';
    // Contact Process
    if (t.includes('contact')) return '⚙️';
    // Reduction of Metal Oxide
    if (t.includes('reduction') || t.includes('oxide')) return '🌋';
    // Fermentation
    if (t.includes('ferment')) return '🍇';
    // General Acid fallback
    if (t.includes('acid')) return '🧪';
    
    return '🧪';
}


let currentFocusIndex = -1;

document.addEventListener('keydown', (e) => {
    let cards = Array.from(document.querySelectorAll('#page-' + myCurrentPage + ' .level-card'));
    if(cards.length === 0) return;
    
    let cols = window.innerWidth <= 768 ? 1 : 3;
    
    let handled = true;
    if (e.key === 'ArrowRight') {
        currentFocusIndex++;
        if(currentFocusIndex >= cards.length) currentFocusIndex = 0;
        window.playSound('tactile');
    } else if (e.key === 'ArrowLeft') {
        currentFocusIndex--;
        if(currentFocusIndex < 0) currentFocusIndex = cards.length - 1;
        window.playSound('tactile');
    } else if (e.key === 'ArrowDown') {
        currentFocusIndex += cols;
        if(currentFocusIndex >= cards.length) currentFocusIndex = cards.length - 1;
        window.playSound('tactile');
    } else if (e.key === 'ArrowUp') {
        currentFocusIndex -= cols;
        if(currentFocusIndex < 0) currentFocusIndex = 0;
        window.playSound('tactile');
    } else if (e.key === 'Enter') {
        if(currentFocusIndex >= 0 && currentFocusIndex < cards.length) {
            cards[currentFocusIndex].click();
        }
    } else {
        handled = false;
    }
    
    if(handled) e.preventDefault();
    
    cards.forEach((c, i) => {
        if(i === currentFocusIndex) c.classList.add('kb-focus');
        else c.classList.remove('kb-focus');
    });
});


window.renderChallengeScreen = function(params) {
    let currentTier = (params.get('tier') || 'easy').toLowerCase();
    const playerName = params.get('name') || localStorage.getItem('currentPlayer') || 'Player';
    
    // Switch background layer from blue to purple
    const bgEl = document.getElementById('bg-levels');
    if (bgEl) {
        bgEl.className = 'bg-layer bg-orange active-bg';
    }
    document.body.classList.add('is-challenge-mode');

    // Helper: Capitalize
    function formatTierName(t) {
        return t.charAt(0).toUpperCase() + t.slice(1);
    }

    // 1. Clean Header: Replace greeting, subtitle, and score widget
    const titleEl = document.getElementById('form-title');
    if (titleEl) {
        titleEl.innerText = `${formatTierName(currentTier)} Challenge`;
    }

    // Activate the top-right tier selector
    const tierSelector = document.getElementById('challenge-tier-selector');
    if (tierSelector) {
        tierSelector.style.display = 'inline-flex';
        updateTierButtons(currentTier);
        
        tierSelector.querySelectorAll('.tier-tab-btn').forEach(btn => {
            btn.onclick = function(e) {
                e.stopPropagation();
                if (typeof window.playSound === 'function') window.playSound('retro-select');
                const selectedTier = btn.getAttribute('data-tier');
                if (selectedTier !== currentTier) {
                    currentTier = selectedTier;
                    config.tier = selectedTier;
                    
                    // Update header title
                    if (titleEl) titleEl.innerText = `${formatTierName(currentTier)} Challenge`;
                    
                    // Update right column tier badge
                    const tierPill = document.getElementById('cfg-tier-pill');
                    if (tierPill) {
                        tierPill.innerText = `${currentTier.toUpperCase()} MODE`;
                        if (currentTier === 'hard') tierPill.style.background = '#ef4444';
                        else if (currentTier === 'medium') tierPill.style.background = '#f59e0b';
                        else tierPill.style.background = '#10b981';
                    }
                    
                    updateTierButtons(currentTier);
                    
                    // Update browser URL query without reloading
                    const newUrl = `levels.html?mode=challenge&tier=${encodeURIComponent(currentTier)}&name=${encodeURIComponent(playerName)}`;
                    window.history.replaceState({ tier: currentTier }, '', newUrl);
                    
                    updateLiveMultiplier();
                }
            };
        });
    }

    function updateTierButtons(activeTier) {
        if (!tierSelector) return;
        tierSelector.querySelectorAll('.tier-tab-btn').forEach(b => {
            if (b.getAttribute('data-tier') === activeTier) {
                b.classList.add('active');
            } else {
                b.classList.remove('active');
            }
        });
    }

    // 2. Modifiers state (Standard Baseline: Scale ON, Hints ON, Timer Stopwatch)
    let challenges = {
        hideScale: false,
        noHints: false,
        speedRush: false
    };

    let config = {
        tier: currentTier,
        scale: 'on',
        hints: '1',
        timer: 'stopwatch',
        player: playerName
    };
    
    // Dynamic Summary Sentence
    function getSummarySentence() {
        if (!challenges.speedRush) {
            if (!challenges.hideScale && !challenges.noHints) {
                return 'Balance 5 equations in the <b style="color:#10b981;">fastest possible time</b> with the 3D scale and 1 hint token.';
            } else if (challenges.hideScale && !challenges.noHints) {
                return 'Balance 5 equations in the <b style="color:#10b981;">fastest possible time</b> using <b style="color:#7e22ce;">mental math</b>, with 1 hint token.';
            } else if (!challenges.hideScale && challenges.noHints) {
                return 'Balance 5 equations in the <b style="color:#10b981;">fastest possible time</b> with the 3D scale and <b style="color:#2563eb;">zero hints</b>.';
            } else {
                return 'Balance 5 equations in the <b style="color:#10b981;">fastest possible time</b> using pure <b style="color:#7e22ce;">mental math</b> with <b style="color:#2563eb;">zero hints</b>.';
            }
        } else {
            if (!challenges.hideScale && !challenges.noHints) {
                return 'Race against the clock to balance 5 equations in <b style="color:#d97706;">90 seconds</b>, with the 3D scale and 1 hint token.';
            } else if (challenges.hideScale && !challenges.noHints) {
                return 'Race against the clock to balance 5 equations in <b style="color:#d97706;">90 seconds</b> using <b style="color:#7e22ce;">mental math</b>, with 1 hint token.';
            } else if (!challenges.hideScale && challenges.noHints) {
                return 'Race against the clock to balance 5 equations in <b style="color:#d97706;">90 seconds</b> with the 3D scale and <b style="color:#2563eb;">zero hints</b>.';
            } else {
                return 'The ultimate run: balance 5 equations in <b style="color:#d97706;">90 seconds</b> using pure <b style="color:#7e22ce;">mental math</b> with <b style="color:#2563eb;">zero hints</b>.';
            }
        }
    }
    
    const gridWrapper = document.querySelector('.grid-wrapper');
    if (!gridWrapper) return;
    gridWrapper.innerHTML = '';
    
    const challengeHtml = `
        <div class="challenge-main-container">
            
            <!-- MIDDLE AREA: SPLIT INTO LEFT (MODIFIERS) AND RIGHT (OVERVIEW) -->
            <div class="challenge-split-deck">
                
                <!-- LEFT COLUMN: CHALLENGE MODIFIERS -->
                <div class="deck-left-col">
                    <div class="deck-header-wrap">

    gridWrapper.innerHTML = challengeHtml;
    
    // Tier pill styling

    if (tierPill) {
        if (currentTier === 'hard') tierPill.style.background = '#ef4444';
        else if (currentTier === 'medium') tierPill.style.background = '#f59e0b';
        else tierPill.style.background = '#10b981';
    }

    // Dynamic Multiplier & Badge Counter Logic
    function updateLiveMultiplier() {
        let mult = 1.0;
        let activeCount = 0;
        let unlockedBadges = 1;
        
        if (challenges.hideScale) {
            mult += 0.5;
            activeCount++;
            unlockedBadges++;
        }
        if (challenges.noHints) {
            mult += 0.5;
            activeCount++;
            unlockedBadges++;
        }
        if (challenges.speedRush) {
            mult += 0.5;
            activeCount++;
            unlockedBadges++;
        }
        
        const statusPill = document.getElementById('deck-status-pill');
        if (statusPill) {
            statusPill.innerText = `${activeCount} / 3 ACTIVE`;
            if (activeCount > 0) {
                statusPill.style.background = '#f3e8ff';
                statusPill.style.color = '#7e22ce';
                statusPill.style.borderColor = '#7e22ce';
            } else {
                statusPill.style.background = '#f1f5f9';
                statusPill.style.color = 'var(--dark-border)';
                statusPill.style.borderColor = 'var(--dark-border)';
            }
        }
        
        const multValEl = document.getElementById('cfg-multiplier-val');
        if (multValEl) multValEl.innerText = mult.toFixed(1) + 'x';
        
        const multTagEl = document.getElementById('cfg-multiplier-tag');
        if (multTagEl) {
            if (mult >= 2.5) {
                multTagEl.innerText = 'LEGENDARY (+1.5x)';
                multTagEl.style.background = '#fef3c7';
                multTagEl.style.color = '#d97706';
                multTagEl.style.borderColor = '#d97706';
            } else if (mult >= 2.0) {
                multTagEl.innerText = 'EXPERT (+1.0x)';
                multTagEl.style.background = '#f3e8ff';
                multTagEl.style.color = '#7e22ce';
                multTagEl.style.borderColor = '#7e22ce';
            } else if (mult >= 1.5) {
                multTagEl.innerText = 'VETERAN (+0.5x)';
                multTagEl.style.background = '#dbeafe';
                multTagEl.style.color = '#2563eb';
                multTagEl.style.borderColor = '#2563eb';
            } else {
                multTagEl.innerText = 'STANDARD';
                multTagEl.style.background = '#f1f5f9';
                multTagEl.style.color = '#64748b';
                multTagEl.style.borderColor = '#cbd5e1';
            }
        }
        
        const barEl = document.getElementById('cfg-multiplier-bar');
        if (barEl) {
            let pct = Math.round(((mult - 1.0) / 1.5) * 80 + 20);
            barEl.style.width = pct + '%';
        }
        
        const countEl = document.getElementById('cfg-badges-count');
        if (countEl) countEl.innerText = `${unlockedBadges} / 4 QUALIFIED`;

        const sentenceEl = document.getElementById('cfg-dynamic-sentence');
        if (sentenceEl) {
            sentenceEl.innerHTML = getSummarySentence();
        }
    }

    // Toggle Challenge 1: Hide 3D Scale
    function toggleHideScale() {
        if (typeof window.playSound === 'function') window.playSound('tactile');
        challenges.hideScale = !challenges.hideScale;
        config.scale = challenges.hideScale ? 'off' : 'on';
        
        let card = document.getElementById('row-hide-scale');
        let sw = document.getElementById('switch-hide-scale');
        let desc = document.getElementById('desc-hide-scale');
        
        if (challenges.hideScale) {
            if (card) {
                card.classList.add('active-scale');
                card.classList.remove('is-neutral');
            }
            if (sw) {
                sw.classList.add('is-active', 'is-on-amber');
            }
            if (desc) {
                desc.innerText = 'ACTIVE (+0.5x)';
            }
        } else {
            if (card) {
                card.classList.remove('active-scale');
                card.classList.add('is-neutral');
            }
            if (sw) {
                sw.classList.remove('is-active', 'is-on-amber');
            }
            if (desc) {
                desc.innerText = '+0.5x Multiplier';
            }
        }
        
        let chip = document.getElementById('chip-badge-mental');
        if (chip) {
            chip.className = 'lab-badge-chip ' + (challenges.hideScale ? 'unlocked-mental' : 'locked');
        }
        updateLiveMultiplier();
    }
    
    // Toggle Challenge 2: Disable Hints
    function toggleNoHints() {
        if (typeof window.playSound === 'function') window.playSound('tactile');
        challenges.noHints = !challenges.noHints;
        config.hints = challenges.noHints ? '0' : '1';
        
        let card = document.getElementById('row-no-hints');
        let sw = document.getElementById('switch-no-hints');
        let desc = document.getElementById('desc-no-hints');
        
        if (challenges.noHints) {
            if (card) {
                card.classList.add('active-hints');
                card.classList.remove('is-neutral');
            }
            if (sw) {
                sw.classList.add('is-active', 'is-on-blue');
            }
            if (desc) {
                desc.innerText = 'ACTIVE (+0.5x)';
            }
        } else {
            if (card) {
                card.classList.remove('active-hints');
                card.classList.add('is-neutral');
            }
            if (sw) {
                sw.classList.remove('is-active', 'is-on-blue');
            }
            if (desc) {
                desc.innerText = '+0.5x Multiplier';
            }
        }
        
        let chip = document.getElementById('chip-badge-solo');
        if (chip) {
            chip.className = 'lab-badge-chip ' + (challenges.noHints ? 'unlocked-solo' : 'locked');
        }
        updateLiveMultiplier();
    }
    
    // Toggle Challenge 3: 90s Speed Rush
    function toggleSpeedRush() {
        if (typeof window.playSound === 'function') window.playSound('tactile');
        challenges.speedRush = !challenges.speedRush;
        config.timer = challenges.speedRush ? 'countdown' : 'stopwatch';
        
        let card = document.getElementById('row-rush-mode');
        let sw = document.getElementById('switch-rush-mode');
        let desc = document.getElementById('desc-rush-mode');
        
        if (challenges.speedRush) {
            if (card) {
                card.classList.add('active-rush');
                card.classList.remove('is-neutral');
            }
            if (sw) {
                sw.classList.add('is-active', 'is-on-amber');
            }
            if (desc) {
                desc.innerText = 'ACTIVE (+0.5x)';
            }
        } else {
            if (card) {
                card.classList.remove('active-rush');
                card.classList.add('is-neutral');
            }
            if (sw) {
                sw.classList.remove('is-active', 'is-on-amber');
            }
            if (desc) {
                desc.innerText = '+0.5x Multiplier';
            }
        }
        
        let chip = document.getElementById('chip-badge-speed');
        if (chip) {
            chip.className = 'lab-badge-chip ' + (challenges.speedRush ? 'unlocked-speed' : 'locked');
        }
        updateLiveMultiplier();
    }
    
    // Wire up events
    const rowScale = document.getElementById('row-hide-scale');
    if (rowScale) rowScale.addEventListener('click', toggleHideScale);
    
    const rowHints = document.getElementById('row-no-hints');
    if (rowHints) rowHints.addEventListener('click', toggleNoHints);
    
    const rowTimer = document.getElementById('row-rush-mode');
    if (rowTimer) rowTimer.addEventListener('click', toggleSpeedRush);
    
    // Launch button
    const btnLaunch = document.getElementById('btn-launch-challenge');
    if (btnLaunch) {
        btnLaunch.addEventListener('click', (e) => {
            e.stopPropagation();
            if (typeof window.playSound === 'function') window.playSound('start');
            let url = `game.html?mode=challenge&tier=${encodeURIComponent(config.tier)}&scale=${config.scale}&hints=${config.hints}&timer=${config.timer}&name=${encodeURIComponent(config.player)}`;
            window.transitionTo(url);
        });
    }
};


window.renderSandboxLevelsScreen = function(params) {
    document.documentElement.classList.add('is-sandbox-mode');
    document.body.classList.add('is-sandbox-mode');
    const bgEl = document.getElementById('bg-levels');
    if (bgEl) {
        bgEl.className = 'bg-layer bg-purple active-bg';
        bgEl.style.background = '#7c3aed';
    }

    const nameParam = params.get('name') || localStorage.getItem('currentPlayer') || 'Player';
    const nameEl = document.getElementById('display-name');
    if (nameEl) nameEl.innerText = nameParam;

    const titleEl = document.getElementById('form-title');
    if (titleEl) titleEl.innerText = 'Sandbox Levels';

    const subEl = document.querySelector('.levels-subtitle');
    if (subEl) subEl.innerText = 'CUSTOM CREATED REACTIONS';

    // Hide tutorial button in sandbox mode (tutorial is only for syllabus mode)
    const tutBtn = document.getElementById('btn-levels-tutorial');
    if (tutBtn) tutBtn.style.display = 'none';

    // Remove old header create button if present
    const oldCreateBtn = document.getElementById('btn-sandbox-create-level');
    if (oldCreateBtn) oldCreateBtn.remove();

    const gridContainer = document.querySelector('.grid-wrapper');
    if (!gridContainer) return;

    window.deleteSandboxCustomLevel = function(idx) {
        let currentSaved = JSON.parse(localStorage.getItem('stoich_saved_custom_levels') || '[]');
        let item = currentSaved[idx];
        let titleStr = (item && (item.title || item.equation)) || 'this level';
        if (confirm(`Delete level "${titleStr}"?`)) {
            if (typeof window.playSound === 'function') window.playSound('trash');
            currentSaved.splice(idx, 1);
            localStorage.setItem('stoich_saved_custom_levels', JSON.stringify(currentSaved));
            renderList();
        }
    };

    function renderList() {
        gridContainer.querySelectorAll('.levels-grid, .pagination').forEach(el => el.remove());

        let saved = JSON.parse(localStorage.getItem('stoich_saved_custom_levels') || '[]');

        const scoreText = document.querySelector('.score-text');
        if (scoreText) scoreText.innerText = `${saved.length} Created`;

        if (saved.length === 0) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'levels-grid';
            emptyDiv.style.cssText = 'display:flex; justify-content:center; align-items:center; width:100%; min-height:360px;';
            emptyDiv.innerHTML = `
                <div style="text-align:center; padding:48px 24px; background:#ffffff; border:4px solid #1e293b; border-radius:28px; box-shadow:0 10px 0 #1e293b; max-width:540px; margin:20px auto; width:90%; box-sizing:border-box;">
                    <div style="font-size:56px; line-height:1; margin-bottom:14px;">🧪</div>
                    <h2 style="font-size:24px; font-weight:900; color:#1e1b4b; margin:0 0 8px 0;">No Custom Levels Yet!</h2>
                    <p style="font-size:14.5px; font-weight:700; color:#64748b; margin:0 0 22px 0; line-height:1.5;">Click below to open the Periodic Table & Numpad builder and craft your first custom reaction level.</p>
                    <button class="interactive" onclick="window.transitionTo('index.html?mode=sandbox&action=create')" style="background:#8b5cf6; color:#ffffff; border:3.5px solid #1e293b; border-radius:16px; padding:12px 24px; font-size:16px; font-weight:900; box-shadow:0 5px 0 #1e293b; cursor:pointer; display:inline-flex; align-items:center; gap:8px;">
                        <span>✨</span> <span>Create Your First Level</span>
                    </button>
                </div>
            `;
            gridContainer.appendChild(emptyDiv);
            return;
        }

        const totalItems = saved.length + 1;
        myTotalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
        if (myTotalPages < 1) myTotalPages = 1;
        if (myCurrentPage > myTotalPages) myCurrentPage = myTotalPages;

        for (let p = 1; p <= myTotalPages; p++) {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'levels-grid';
            pageDiv.id = 'page-' + p;
            pageDiv.style.display = (p === myCurrentPage) ? '' : 'none';

            const startIdx = (p - 1) * ITEMS_PER_PAGE;
            const endIdx = Math.min(startIdx + ITEMS_PER_PAGE, totalItems);

            for (let i = startIdx; i < endIdx; i++) {
                if (i < saved.length) {
                    const lvl = saved[i];
                    const niceNum = i + 1;
                    const card = document.createElement('div');
                    card.className = 'level-card interactive';
                    card.onmouseenter = () => {
                        if (typeof window.playSound === 'function') window.playSound('tactile');
                        currentFocusIndex = -1;
                        Array.from(document.querySelectorAll('.level-card')).forEach(c => c.classList.remove('kb-focus'));
                    };
                    card.onclick = (e) => {
                        e.currentTarget.style.transform = 'translateY(6px)';
                        e.currentTarget.style.setProperty('box-shadow', 'none', 'important');
                        if (typeof window.playSound === 'function') window.playSound('retro-select');
                        window.transitionTo(`game.html?level=sandbox&name=${encodeURIComponent(nameParam)}&eq=${encodeURIComponent(lvl.equation)}`);
                    };

                    const eqText = lvl.equation || 'Custom Reaction';
                    let displayTitle = lvl.title;
                    if (!displayTitle || displayTitle.startsWith('Custom:') || displayTitle.trim() === eqText.trim()) {
                        displayTitle = `Custom Reaction #${niceNum}`;
                    }
                    const iconText = (typeof getLevelIcon === 'function') ? getLevelIcon(displayTitle || lvl.equation, false) : '🧪';

                    card.innerHTML = `
                        <div class="card-top">
                            <span class="lvl-num">${niceNum}</span>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span class="lvl-diff diff-easy" style="background:#8b5cf6; color:white; border-color:#1e293b;">Custom</span>
                                <button type="button" class="btn-card-delete interactive" title="Delete custom level" onclick="event.stopPropagation(); window.deleteSandboxCustomLevel(${i});">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="3 6 5 6 21 6"/>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="card-icon">${iconText}</div>
                            <h3 class="lvl-name">${displayTitle}</h3>
                            <p class="lvl-equation">${eqText}</p>
                        </div>
                        <div class="status-banner banner-blue">PLAY</div>
                    `;
                    pageDiv.appendChild(card);
                } else {
                    const createCard = document.createElement('div');
                    createCard.className = 'level-card interactive';
                    createCard.onmouseenter = () => {
                        if (typeof window.playSound === 'function') window.playSound('tactile');
                        currentFocusIndex = -1;
                        Array.from(document.querySelectorAll('.level-card')).forEach(c => c.classList.remove('kb-focus'));
                    };
                    createCard.onclick = (e) => {
                        e.currentTarget.style.transform = 'translateY(6px)';
                        e.currentTarget.style.setProperty('box-shadow', 'none', 'important');
                        if (typeof window.playSound === 'function') window.playSound('click');
                        window.transitionTo(`index.html?mode=sandbox&action=create&name=${encodeURIComponent(nameParam)}`);
                    };

                    createCard.innerHTML = `
                        <div class="card-top">
                            <span class="lvl-num" style="background:#ede9fe; color:#6d28d9; font-weight:900;">+</span>
                            <span class="lvl-diff diff-easy" style="background:#f3e8ff; color:#7e22ce; border-color:#d8b4fe;">Create</span>
                        </div>
                        <div class="card-body">
                            <div class="card-icon">⚗️</div>
                            <h3 class="lvl-name">Build New Level</h3>
                            <p class="lvl-equation" style="color:#6d28d9; background:#f5f3ff; border-color:#ddd6fe;">Periodic Table & Numpad</p>
                        </div>
                        <div class="status-banner banner-blue" style="background:#8b5cf6 !important; border-top-color:#6d28d9 !important;">+ CREATE LEVEL</div>
                    `;
                    pageDiv.appendChild(createCard);
                }
            }
            gridContainer.appendChild(pageDiv);
        }

        const pagDiv = document.createElement('div');
        pagDiv.className = 'pagination';

        const prevBtn = document.createElement('button');
        prevBtn.className = 'btn-page interactive';
        prevBtn.id = 'btn-prev';
        prevBtn.innerHTML = '◀ Prev';
        prevBtn.disabled = (myCurrentPage === 1);
        prevBtn.onclick = () => {
            if (typeof window.playSound === 'function') window.playSound('page');
            window.changePage(myCurrentPage - 1);
        };

        const dotsDiv = document.createElement('div');
        dotsDiv.className = 'page-dots';
        for (let p = 1; p <= myTotalPages; p++) {
            const dot = document.createElement('span');
            dot.className = 'dot' + (p === myCurrentPage ? ' active' : '');
            dot.id = 'dot-' + p;
            dotsDiv.appendChild(dot);
        }

        const nextBtn = document.createElement('button');
        nextBtn.className = 'btn-page interactive';
        nextBtn.id = 'btn-next';
        nextBtn.innerHTML = 'Next ▶';
        nextBtn.disabled = (myCurrentPage === myTotalPages);
        nextBtn.onclick = () => {
            if (typeof window.playSound === 'function') window.playSound('page');
            window.changePage(myCurrentPage + 1);
        };

        pagDiv.appendChild(prevBtn);
        pagDiv.appendChild(dotsDiv);
        pagDiv.appendChild(nextBtn);

        gridContainer.appendChild(pagDiv);
    }

    renderList();
};

document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    if (params.get('mode') === 'challenge') {
        window.renderChallengeScreen(params);
        return;
    }
    if (params.get('mode') === 'sandbox') {
        window.renderSandboxLevelsScreen(params);
        return;
    }
    const formParam = params.get('form') || 'Form 4';
    const nameParam = params.get('name') || 'Player';
    const nameEl = document.getElementById('display-name');
    if (nameEl) nameEl.innerText = nameParam;
    const formNumber = formParam.includes('5') ? '5' : '4';
    if (formNumber === '5') {
        document.documentElement.classList.add('is-form5-mode');
        document.body.classList.add('is-form5-mode');
        const bgEl = document.getElementById('bg-levels');
        if (bgEl) {
            bgEl.className = 'bg-layer bg-green active-bg';
        }
    }
    
    // Update titles
    const titleEl = document.getElementById('form-title');
    if(titleEl) titleEl.innerText = formParam;
    
    // Filter keys by form
    let keys = Object.keys(LEVELS).filter(k => k.startsWith('F' + formNumber));
    keys.sort((a,b) => {
        let aMatch = a.match(/L(\d+)/);
        let bMatch = b.match(/L(\d+)/);
        if(!aMatch || !bMatch) return a.localeCompare(b);
        return parseInt(aMatch[1]) - parseInt(bMatch[1]);
    });
    
    myTotalPages = Math.ceil(keys.length / ITEMS_PER_PAGE);
    if(myTotalPages === 0) myTotalPages = 1;
    
    let gridContainer = document.querySelector('.grid-wrapper');
    
    // Calculate Score
    let solvedData = JSON.parse(localStorage.getItem('solvedLevelData_' + (localStorage.getItem('currentPlayer')||'Player')) || '{}');
    // Legacy support: if it's an array, convert it to an object temporarily for counting
    let legacySolved = JSON.parse(localStorage.getItem('solvedLevels_' + (localStorage.getItem('currentPlayer')||'Player')) || '[]');
    let solvedCount = 0;
    
    keys.forEach(k => {
        if (solvedData[k] || legacySolved.includes(k)) solvedCount++;
    });
    
    let scoreText = document.querySelector('.score-text');
    let scoreIcon = document.querySelector('.score-icon');
    if(scoreText) scoreText.innerText = solvedCount + ' / ' + keys.length;
    if(scoreIcon) scoreIcon.innerHTML = `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.45 1-1 1H8c-.55 0-1 .45-1 1v3h10v-3c0-.55-.45-1-1-1h-1c-.55 0-1-.45-1-1v-2.34M18 4H6v7a6 6 0 0 0 12 0V4z"/>
                    </svg>`;


    if(!gridContainer) return;
    
    const existingGrids = gridContainer.querySelectorAll('.levels-grid');
    existingGrids.forEach(g => g.remove());
    const existingPag = gridContainer.querySelector('.pagination');
    if(existingPag) existingPag.remove();

    for(let p=1; p<=myTotalPages; p++) {
        let pageDiv = document.createElement('div');
        pageDiv.className = 'levels-grid';
        pageDiv.id = 'page-' + p;
        pageDiv.style.display = p === 1 ? '' : 'none';
        
        let startIdx = (p - 1) * ITEMS_PER_PAGE;
        let endIdx = Math.min(startIdx + ITEMS_PER_PAGE, keys.length);
        
        for(let i=startIdx; i<endIdx; i++) {
            let k = keys[i];
            let L = LEVELS[k];
            
            let diff = 'easy';
            let diffLabel = 'Easy';
            if (L.elements.length === 3) { diff = 'medium'; diffLabel = 'Medium'; }
            if (L.elements.length >= 4) { diff = 'hard'; diffLabel = 'Hard'; }
            
            // Extract the level number, e.g. F4L1 -> 1
            let niceNum = k.replace(/F\d+L/, '');
            
            let card = document.createElement('div');
            let solvedLevels = JSON.parse(localStorage.getItem('solvedLevels_' + (localStorage.getItem('currentPlayer')||'Player')) || '[]');
            let solvedData = JSON.parse(localStorage.getItem('solvedLevelData_' + (localStorage.getItem('currentPlayer')||'Player')) || '{}');
            let isSolved = solvedData[k] ? true : solvedLevels.includes(k);
            let stars = solvedData[k] ? solvedData[k].stars : (isSolved ? 3 : 0); // Legacy defaults to 3
            
            
            card.className = isSolved ? 'level-card interactive solved-card' : 'level-card interactive';
            card.onmouseenter = () => { window.playSound('tactile'); currentFocusIndex = -1; Array.from(document.querySelectorAll('.level-card')).forEach(c => c.classList.remove('kb-focus')); };
            card.onclick = (e) => { 
                e.currentTarget.style.transform = 'translateY(6px)';
                e.currentTarget.style.setProperty('box-shadow', 'none', 'important');
                window.playSound('retro-select');
                window.transitionTo(`game.html?level=${k}&form=${encodeURIComponent(formParam)}&name=${encodeURIComponent(nameParam)}`);
            };
            
            let bannerClass = isSolved ? 'banner-green' : 'banner-blue';
            let bannerText = isSolved ? 'REVIEW (SOLVED)' : 'PLAY';
            let iconText = getLevelIcon(L.title, isSolved);
            
            let starHtml = '';
            if (isSolved) {
                const makeFull = () => `<svg width="24" height="24" viewBox="0 0 24 24" fill="#facc15" stroke="#ca8a04" stroke-width="2" stroke-linejoin="round" style="margin:0 2px; filter:drop-shadow(0 2px 0 rgba(0,0,0,0.18));"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>`;
                const makeHalf = () => `<svg width="24" height="24" viewBox="0 0 24 24" stroke="#ca8a04" stroke-width="2" stroke-linejoin="round" style="margin:0 2px; filter:drop-shadow(0 2px 0 rgba(0,0,0,0.18));"><defs><linearGradient id="hgPopup" x1="0" x2="1" y1="0" y2="0"><stop offset="50%" stop-color="#facc15"/><stop offset="50%" stop-color="#e2e8f0"/></linearGradient></defs><polygon fill="url(#hgPopup)" points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>`;
                
                let sIcons = '';
                if (stars >= 3) {
                    sIcons = makeFull() + makeFull() + makeFull();
                } else if (stars >= 2.5) {
                    sIcons = makeFull() + makeFull() + makeHalf();
                } else if (stars >= 2) {
                    sIcons = makeFull() + makeFull();
                } else if (stars >= 1.5) {
                    sIcons = makeFull() + makeHalf();
                } else if (stars >= 1) {
                    sIcons = makeFull();
                } else {
                    sIcons = makeFull() + makeFull() + makeFull();
                }
                starHtml = `<span class="lvl-stars">${sIcons}</span>`;
            }

            card.innerHTML = `
                <div class="card-top">
                    <span class="lvl-num">${niceNum}</span>
                    ${starHtml}
                    <span class="lvl-diff diff-${diff}">${diffLabel}</span>
                </div>
                <div class="card-body">
                    <div class="card-icon">${iconText}</div>
                    <h3 class="lvl-name">${L.title}</h3>
                    <p class="lvl-equation">${L.equation}</p>
                </div>
                <div class="status-banner ${bannerClass}">${bannerText}</div>
            `;
            pageDiv.appendChild(card);
        }
        gridContainer.appendChild(pageDiv);
    }
    
    let pagDiv = document.createElement('div');
    pagDiv.className = 'pagination';
    
    let prevBtn = document.createElement('button');
    prevBtn.className = 'btn-page interactive';
    prevBtn.id = 'btn-prev';
    prevBtn.innerHTML = '◀ Prev';
    prevBtn.disabled = true;
    prevBtn.onclick = () => { window.playSound('page'); window.changePage(myCurrentPage - 1); };
    
    let dotsDiv = document.createElement('div');
    dotsDiv.className = 'page-dots';
    for(let p=1; p<=myTotalPages; p++) {
        let dot = document.createElement('span');
        dot.className = 'dot' + (p === 1 ? ' active' : '');
        dot.id = 'dot-' + p;
        dotsDiv.appendChild(dot);
    }
    
    let nextBtn = document.createElement('button');
    nextBtn.className = 'btn-page interactive';
    nextBtn.id = 'btn-next';
    nextBtn.innerHTML = 'Next ▶';
    nextBtn.disabled = myTotalPages <= 1;
    nextBtn.onclick = () => { window.playSound('page'); window.changePage(myCurrentPage + 1); };
    
    pagDiv.appendChild(prevBtn);
    pagDiv.appendChild(dotsDiv);
    pagDiv.appendChild(nextBtn);
    
    gridContainer.appendChild(pagDiv);
});

window.changePage = function(newPage) {
    if(newPage < 1 || newPage > myTotalPages) return;
    document.getElementById('page-' + myCurrentPage).style.display = 'none';
    document.getElementById('dot-' + myCurrentPage).classList.remove('active');
    myCurrentPage = newPage;
    document.getElementById('page-' + myCurrentPage).style.display = '';
    document.getElementById('dot-' + myCurrentPage).classList.add('active');
    document.getElementById('btn-prev').disabled = (myCurrentPage === 1);
    document.getElementById('btn-next').disabled = (myCurrentPage === myTotalPages);
};
</script>
    <!-- Persistent Fullscreen Toggle Button -->
    <button class="btn-fullscreen-toggle interactive" onclick="window.toggleFullscreen()" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;display:block;"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>
    <script src="js/fullscreen.js"></script>
    <script src="js/autoscale.js"></script>
</body>
</html>
